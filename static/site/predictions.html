<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прогнозы · F1 HUB</title>
<link rel="stylesheet" href="/static/fonts/racing.css">
<link rel="stylesheet" href="/static/fonts/f1-fonts.css">
<link rel="stylesheet" href="/static/site/app.css?v=28530c7e">
<style>
.lead-block{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:center;margin-bottom:56px}
.lead-block .art{position:relative;overflow:hidden;aspect-ratio:16/10;background:var(--s2)}
.lead-block .art img{width:100%;height:100%;object-fit:cover}
.lead-block h2{margin:0 0 18px;font-family:'F1Display','Russo One',sans-serif;font-size:clamp(28px,3.4vw,44px);
  text-transform:uppercase;line-height:1.02}
.lead-block p{margin:0 0 26px;font-size:16.5px;line-height:1.62;color:var(--txt-2);max-width:54ch}
.lb-top{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lb-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:18px;align-items:center;
  padding:16px 0;border-bottom:1px solid var(--line)}
.lb-row .p{font-family:'F1Display','Russo One',sans-serif;font-size:22px;color:var(--txt-3)}
.lb-row:nth-child(1) .p{color:var(--red)}
.lb-row .nm{font-weight:700;font-size:16px}
.lb-row .sc{font-family:'F1Display','Russo One',sans-serif;font-size:20px}
@media (max-width:980px){ .lead-block{grid-template-columns:1fr;gap:28px} }
</style>
</head>
<body>

<header><div class="wrap hd"></div></header>

<div class="wrap">
  <div class="page-head">
    <div class="crumb"><a href="/static/site/index.html">Главное</a> · Прогнозы</div>
    <h1 class="display">Прогнозы</h1>
    <p class="sub">Ставьте прогноз до старта квалификации — очки начисляются автоматически по результатам гонки.</p>
  </div>

  <div class="lead-block">
    <div>
      <h2 id="gpTitle">Прогноз на этап</h2>
      <p id="gpText">Выберите победителя, подиум по местам, быстрый круг, число сходов и появление сейфти-кара.</p>
      <button class="btn btn-red">Сделать прогноз</button>
    </div>
    <div class="art"><img id="gpImg" src="/static/img/site/story-1.jpg" alt=""></div>
  </div>

  <div class="sec-hd"><h2 style="font-size:26px">Сколько дают очков</h2></div>
  <div class="pred-grid" id="rules"></div>

  <div style="height:56px"></div>
  <div class="sec-hd"><h2 style="font-size:26px">Лидеры лиги</h2></div>
  <div class="lb-top" id="board"></div>
  <div style="height:80px"></div>
</div>

<footer><div class="wrap"></div></footer>

<script src="/static/site/site.js?v=28530c7e"></script>
<script>
(async () => {
  const {j, esc, img, cityOf, dayRange} = F1;
  const [home, avail, board] = await Promise.all([
    j('/api/home?season=2026'), j('/api/predictions/rules'), j('/api/leaderboard')
  ]);
  const nr = home?.next_race;
  if (nr) {
    document.getElementById('gpTitle').textContent = 'Прогноз на ' + (cityOf(nr) || nr.name);
    document.getElementById('gpText').textContent =
      (nr.name || '') + ' · ' + dayRange(nr) + '. Прогнозы закрываются со стартом квалификации — ' +
      'победитель, подиум по местам, быстрый круг, число сходов и сейфти-кар.';
    if (nr.circuit_image) {
      const el = document.getElementById('gpImg');
      el.dataset.fb = '/static/img/site/story-1.jpg';
      el.onerror = () => F1.imgFail(el);
      el.src = nr.circuit_image;
    }
  }

  // правила очков берём с бэкенда — единый источник, ничего не выдумываем
  const rules = (avail?.rules || []).map(p => ({v: p.max_points ?? '—', t: p.label, d: p.description || ''}));
  document.getElementById('rules').innerHTML = rules.length
    ? rules.map(r => '<div class="pcard"><div class="v">' + esc(r.v) + '</div>' +
        '<h3>' + esc(r.t) + '</h3><p>' + esc(r.d) + '</p></div>').join('')
    : '<div class="empty">Правила начисления пока недоступны</div>';

  const rows = board?.leaderboard || board || [];
  document.getElementById('board').innerHTML = rows.length
    ? rows.slice(0,10).map((u,i) =>
        '<div class="lb-row"><span class="p">' + String(i+1).padStart(2,'0') + '</span>' +
        '<span class="nm">' + esc(u.first_name || u.name || u.username || 'Игрок') + '</span>' +
        '<span class="sc">' + Math.round(u.points ?? u.score ?? 0) + '</span></div>').join('')
    : '<div class="empty">Лига откроется после первых прогнозов</div>';
})();
</script>
</body>
</html>
