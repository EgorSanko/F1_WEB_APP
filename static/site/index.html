<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 HUB</title>
<link rel="stylesheet" href="/static/fonts/racing.css">
<link rel="stylesheet" href="/static/fonts/f1-fonts.css">
<link rel="stylesheet" href="/static/site/app.css?v=28530c7e">
</head>
<body>

<header><div class="wrap hd"></div></header>

<section class="hero">
  <div class="hero-bg"><div class="slot slot--fill has-photo"><img id="heroImg" src="/static/img/site/hero-race.jpg" alt=""></div></div>
  <div class="hero-veil"></div>
  <div class="speed"></div>

  <div class="hero-in">
    <div class="hero-copy">
      <div class="label label--red hero-round" id="kRound">Раунд</div>
      <h1 class="display hero-title"><span class="sm">Следующий этап</span><span id="kCity">—</span></h1>
      <div class="hero-when" id="kDates"></div>
      <div class="hero-cta">
        <a class="btn btn-red" id="ctaRace" href="/static/site/races.html">Смотреть гонку</a>
        <a class="arrow-link" id="ctaStage" href="/static/site/races.html">Обзор этапа
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>

  <aside class="nextrace">
    <div class="label">Следующая гонка</div>
    <div class="gp" id="nrName">—</div>
    <div class="when" id="nrWhen"></div>
    <img class="nr-map" id="nrMap" alt="Схема трассы">
    <hr>
    <div class="facts">
      <div id="nrCity"></div>
      <div><b id="nrKm"></b></div>
      <div><b id="nrLaps"></b></div>
    </div>
    <a class="arrow-link muted" id="nrLink" href="/static/site/races.html">Расписание уикенда
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>
  </aside>
</section>

<div class="wrap overlap">
  <div class="duo">
    <section class="panel" id="lastRacePanel"></section>
    <article class="feature" id="feature">
      <div class="slot has-photo"><img id="fImg" src="/static/img/site/news-lead.jpg" alt=""></div>
      <div class="body">
        <div class="meta">
          <span class="label label--red">Главное</span><span class="dot"></span><span class="label" id="fWhen"></span>
        </div>
        <h2 id="fTitle">—</h2>
        <p id="fText"></p>
        <a class="arrow-link" href="#" id="fLink" target="_blank" rel="noopener">Читать
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </article>
  </div>
</div>

<section class="section wrap">
  <div class="sec-hd">
    <h2>Материалы</h2>
    <a class="arrow-link muted" href="/static/site/videos.html">Все материалы
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>
  </div>
  <div class="stories" id="stories"></div>
</section>

<section class="section wrap" id="teams">
  <div class="sec-hd">
    <h2>Команды</h2>
    <a class="arrow-link muted" href="/static/site/teams.html">Все команды
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>
  </div>
  <div class="teams" id="teamsGrid"></div>
</section>

<section class="section section--band" id="champ">
  <div class="wrap">
    <div class="sec-hd">
      <h2>Чемпионат 2026</h2>
      <a class="arrow-link muted" href="/static/site/standings.html">Вся таблица
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </a>
    </div>
    <div class="stand" id="stand"></div>
  </div>
</section>

<section class="section wrap" id="season">
  <div class="sec-hd">
    <h2>Сезон 2026</h2>
    <a class="arrow-link muted" href="/static/site/races.html">Весь календарь
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>
  </div>
  <div class="season">
    <a class="season-card" id="scLink" href="/static/site/races.html">
      <div class="slot slot--3x2 has-photo"><img id="scImg" src="/static/img/site/monza-track.jpg" alt=""></div>
      <div class="body">
        <div class="rd" id="scRound"></div>
        <h3 id="scCity">—</h3>
        <div class="sub" id="scSub"></div>
        <span class="arrow-link" style="margin-top:22px">Открыть этап
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>
    <div class="calendar" id="calendar"></div>
  </div>
</section>

<footer><div class="wrap"></div></footer>

<script src="/static/site/site.js?v=28530c7e"></script>
<script>
(async () => {
  const {j, esc, img, cityOf, countryOf, kmOf, dayRange, mskTime, mapOf, flagOf, clean, plural} = F1;
  const [home, sched, drv, news, teamsData, con] = await Promise.all([
    j('/api/home?season=2026'), j('/api/schedule'), j('/api/standings/drivers?season=2026'),
    j('/api/news'), j('/api/teams?season=2026'), j('/api/standings/constructors?season=2026')
  ]);
  const races = (sched?.races || []).filter(r => r.round);
  const nr = home?.next_race;
  const race = races.find(r => r.round === nr?.round) || nr;
  const logoOf = {}; (teamsData?.teams || []).forEach(t => { if (t.name) logoOf[t.name] = t.logo_url; });

  /* ——— ГЕРОЙ ——— */
  if (nr) {
    document.getElementById('kRound').textContent = 'Раунд ' + nr.round;
    document.getElementById('kCity').textContent = cityOf(nr);
    document.getElementById('kDates').textContent = race ? dayRange(race) + ' ' + (new Date(nr.date).getFullYear()) : '';
    document.getElementById('nrName').textContent = nr.name || '';
    document.getElementById('nrWhen').textContent = (race ? dayRange(race) : '') + (mskTime(nr) ? ' · ' + mskTime(nr) : '');
    document.getElementById('nrCity').textContent = cityOf(nr) + (countryOf(nr) ? ', ' + countryOf(nr) : '');
    const km = kmOf(nr); document.getElementById('nrKm').textContent = km ? km + ' км' : '';
    const laps = race?.laps; document.getElementById('nrLaps').textContent = laps ? laps + ' ' + plural(laps,'круг','круга','кругов') : '';
    const hero = document.getElementById('heroImg');
    if (nr.circuit_image) { hero.dataset.fb = '/static/img/site/hero-race.jpg'; hero.onerror = () => F1.imgFail(hero); hero.src = nr.circuit_image; }
    const mp = document.getElementById('nrMap');
    mp.dataset.fb = nr.circuit_outline || ''; mp.onerror = () => F1.imgFail(mp); mp.src = mapOf(nr.circuit_id);
    const raceUrl = '/static/site/race.html?round=' + nr.round;
    document.getElementById('ctaStage').href = raceUrl;
    document.getElementById('nrLink').href = raceUrl;
    document.getElementById('scLink').href = raceUrl;
    // карточка сезона
    document.getElementById('scRound').textContent = 'Раунд ' + nr.round;
    document.getElementById('scCity').textContent = cityOf(nr);
    document.getElementById('scSub').textContent = (nr.name || '') + (race ? ' · ' + dayRange(race) : '');
    const sc = document.getElementById('scImg');
    if (nr.circuit_image) { sc.dataset.fb = '/static/img/site/monza-track.jpg'; sc.onerror = () => F1.imgFail(sc); sc.src = nr.circuit_image; }
  }

  /* ——— ПОСЛЕДНЯЯ ГОНКА ——— */
  const lr = home?.last_race, res = lr?.results || [];
  const lrRace = races.find(r => r.round === lr?.round);
  const lastPanel = () => {
    const p = document.getElementById('lastRacePanel');
    if (F1.spoilerFree) { p.innerHTML = F1.spoilerVeil('Итоги последней гонки скрыты, чтобы не испортить просмотр.'); return; }
    const w = res[0];
    p.innerHTML =
      '<div class="label">Последняя гонка</div>' +
      '<h2 class="heading" style="margin-top:10px">' + esc(lrRace?.name || lr?.name || '') + '</h2>' +
      (w ? '<div class="winner">' + img(w.photo_url_large || w.card_photo_url, 'wface', w.name) +
        '<div class="wtext"><div class="pos">P1</div>' +
        '<div class="who">' + esc(w.last_name || w.name || '') + '</div>' +
        '<div class="team">' + esc(w.team || '') + '</div></div></div>' : '') +
      '<div class="rest">' + res.slice(1,5).map((r,i) =>
        '<div class="r"><span class="n">' + (i+2) + '</span>' + img(logoOf[r.team], 'tlogo', r.team) +
        '<span class="d">' + esc(r.last_name || r.code || '') + '</span>' +
        '<span class="g">' + esc(r.time || (r.status === 'Lapped' ? '+1 круг' : r.status || '')) + '</span></div>').join('') + '</div>' +
      '<a class="arrow-link muted" href="/static/site/race.html?round=' + (lr?.round ?? '') + '" style="margin-top:24px">Все результаты' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></a>';
  };

  /* ——— НОВОСТИ ———
     фото из телеграм-ленты не используем: там скриншоты таблиц и коллажи,
     под крупные блоки они не годятся. Берём свои репортажные кадры. */
  const posts = (news?.posts || []).filter(p => p.title);
  const when = p => { const d = new Date(p.date_text); if (isNaN(d)) return '';
    const h = Math.round((Date.now() - d) / 36e5);
    return h < 24 ? h + ' ' + plural(h,'час','часа','часов') + ' назад' : d.getDate() + ' ' + F1.M[d.getMonth()]; };
  if (posts[0]) {
    const p = posts[0], body = clean(p.preview);
    document.getElementById('fTitle').textContent = p.title;
    document.getElementById('fWhen').textContent = when(p);
    document.getElementById('fLink').href = p.url || '#';
    const t = document.getElementById('fText');
    if (body) t.textContent = body; else t.remove();
  }
  document.getElementById('stories').innerHTML = posts.slice(1,4).map((p,i) =>
    '<a class="story" href="' + esc(p.url) + '" target="_blank" rel="noopener">' +
      '<div class="slot slot--16x9 has-photo"><img src="' + F1.stockAt(i) + '" alt="" loading="lazy"></div>' +
      '<h3>' + esc(p.title) + '</h3><div class="when">' + when(p) + '</div></a>').join('');

  /* ——— КОМАНДЫ ——— */
  const cList = con?.standings || con || [];
  document.getElementById('teamsGrid').innerHTML = cList.slice(0,6).map((t,i) =>
    '<a class="team-card" href="/static/site/teams.html" style="--tc:' + esc(t.team_color || '#666') + '">' +
      '<div class="top">' + img(t.logo_url || logoOf[t.team], 'tlogo-big', t.team) +
      '<span class="pos">' + String(i+1).padStart(2,'0') + '</span></div>' +
      '<h3>' + esc(t.team || '') + '</h3>' +
      '<div class="pts">' + (F1.spoilerFree ? 'Очки скрыты' : '<b>' + Math.round(t.points ?? 0) + '</b> очков · побед: ' + (t.wins ?? 0)) + '</div>' +
      img(t.car_url, 'car', t.team) + '</a>').join('');

  /* ——— ЧЕМПИОНАТ ——— */
  const st = drv?.standings || drv || [];
  const standBlock = () => {
    const box = document.getElementById('stand');
    if (F1.spoilerFree) { box.innerHTML = F1.spoilerVeil('Таблица чемпионата раскрывает исход прошедших гонок.'); return; }
    box.innerHTML = st.slice(0,5).map((s,i) =>
      '<a class="st" href="/static/site/driver.html?number=' + esc(s.driver_number ?? '') + '">' +
      '<div class="num">' + String(i+1).padStart(2,'0') +
        '<span class="st-face-wrap" style="--tc:' + esc(s.team_color || '#2A2A33') + '">' +
        img(s.photo_url || s.card_photo_url, 'st-face', s.name) + '</span></div>' +
      '<div><div class="name">' + esc(s.last_name || s.name || '') + '</div></div>' +
      '<div class="team">' + img(logoOf[s.team], 'tlogo', s.team) + esc(s.team || '') + '</div>' +
      '<div class="pts"><b>' + Math.round(s.points ?? 0) + '</b><span>ОЧКОВ</span></div></a>').join('');
  };

  /* ——— КАЛЕНДАРЬ ——— */
  const cur = nr?.round ?? 0;
  document.getElementById('calendar').innerHTML = races.map(r =>
    '<a class="cal ' + (r.round === cur ? 'now' : (r.round < cur ? 'done' : '')) + '" href="/static/site/race.html?round=' + r.round + '">' +
      '<span class="n">' + String(r.round).padStart(2,'0') + '</span>' +
      '<span><span class="co">' + img(flagOf(r.country_code), 'flag', countryOf(r)) + esc(countryOf(r)) + '</span>' +
      '<span class="ci">' + esc(cityOf(r)) + '</span></span>' +
      '<span class="dt">' + dayRange(r) + '</span></a>').join('');

  F1.onSpoiler(() => { lastPanel(); standBlock(); });
  lastPanel(); standBlock();
})();
</script>
</body>
</html>
