<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Просмотр · F1 HUB</title>
<link rel="stylesheet" href="/static/fonts/racing.css">
<link rel="stylesheet" href="/static/fonts/f1-fonts.css">
<link rel="stylesheet" href="/static/site/app.css?v=28530c7e">
<style>
.player-wrap{background:#000;margin-bottom:32px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;text-align:center;padding:24px;color:var(--txt-2)}
.vhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:start;margin-bottom:44px}
.vhead .k{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--red);margin-bottom:12px}
.vhead .k img{width:26px;height:18px;object-fit:cover;border-radius:2px}
.vhead h1{margin:0;font-family:'F1Display','Russo One',sans-serif;font-size:clamp(26px,3.4vw,42px);
  text-transform:uppercase;line-height:1.02}
.vhead .m{margin-top:14px;font-size:15px;color:var(--txt-2)}
.vhead .side{text-align:right}
.vhead .side .btn{white-space:nowrap}
.spoiler-note{display:flex;align-items:center;gap:16px;background:var(--s2);padding:18px 22px;margin-bottom:28px}
.spoiler-note img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0}
.spoiler-note p{margin:0;font-size:14.5px;color:var(--txt-2);line-height:1.5}
@media (max-width:900px){ .vhead{grid-template-columns:1fr} .vhead .side{text-align:left} }
</style>
</head>
<body>

<header><div class="wrap hd"></div></header>

<div class="wrap" style="padding-top:32px">
  <div class="crumb" style="margin-bottom:22px;display:flex;gap:10px;font-size:13px;color:var(--txt-3)">
    <a href="/static/site/videos.html">Видео</a> · <span id="crumb">Просмотр</span>
  </div>

  <div class="player-wrap"><div class="player" id="player"></div></div>

  <div class="vhead">
    <div>
      <div class="k" id="kind"></div>
      <h1 id="title">—</h1>
      <div class="m" id="meta"></div>
    </div>
    <div class="side">
      <a class="btn btn-red" id="openSrc" href="#" target="_blank" rel="noopener">Открыть в источнике</a>
    </div>
  </div>

  <div class="sec-hd"><h2 style="font-size:24px">Другие записи этапа</h2></div>
  <div class="vid-grid" id="more"></div>
  <div style="height:80px"></div>
</div>

<footer><div class="wrap"></div></footer>

<script src="/static/site/site.js?v=28530c7e"></script>
<script>
(async () => {
  const {j, esc, img, cityOf, countryOf, flagOf, dayRange, plural} = F1;
  const id = new URLSearchParams(location.search).get('id');
  const [bc, sched] = await Promise.all([j('/api/broadcasts'), j('/api/schedule')]);
  const all = bc?.broadcasts || bc || [];
  const b = all.find(x => String(x.id) === String(id));
  const raceBy = {}; (sched?.races || []).forEach(r => raceBy[r.round] = r);
  const LABEL = {review:'Обзор', race:'Гонка', sprint:'Спринт', qualifying:'Квалификация',
                 sprint_qualifying:'Спринт-квалификация', fp1:'Свободная 1', fp2:'Свободная 2', fp3:'Свободная 3'};

  if (!b) {
    document.getElementById('player').innerHTML =
      '<div class="fallback"><div>Запись не найдена</div>' +
      '<a class="btn btn-red" href="/static/site/videos.html">Ко всем видео</a></div>';
    return;
  }

  const r = raceBy[b.race_round];
  const name = (r ? cityOf(r) : 'Раунд ' + b.race_round) + ' · ' + (LABEL[b.session_type] || b.session_type || '');
  document.title = name + ' · F1 HUB';
  document.getElementById('crumb').textContent = name;
  document.getElementById('kind').innerHTML =
    (r ? img(flagOf(r.country_code), '', countryOf(r)) : '') +
    (b.is_live ? 'В эфире · ' : '') + esc(LABEL[b.session_type] || b.session_type || '');
  document.getElementById('title').textContent = b.title || name;
  document.getElementById('meta').textContent =
    (r ? (r.name || '') + ' · ' + dayRange(r) + ' · ' : '') + 'раунд ' + b.race_round + ' · ' + (b.season || 2026);
  document.getElementById('openSrc').href = b.video_url || b.embed_url || '#';

  /* ——— плеер: у записей уже готов embed_url (VK / YouTube / Rutube) ——— */
  const src = b.embed_url || b.video_url || '';
  const player = document.getElementById('player');
  if (/rutube\.ru\/play\/embed|youtube\.com\/embed|vk\.com\/video_ext|vkvideo\.ru\/video_ext/.test(src)) {
    player.innerHTML = '<iframe src="' + esc(src) + '" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>';
  } else if (src) {
    // не embed-ссылка — предлагаем открыть у источника, чтобы не показывать пустой чёрный экран
    player.innerHTML = '<div class="fallback"><div>Эта запись открывается на площадке-источнике</div>' +
      '<a class="btn btn-red" href="' + esc(src) + '" target="_blank" rel="noopener">Смотреть</a></div>';
  } else {
    player.innerHTML = '<div class="fallback"><div>Ссылка на запись отсутствует</div></div>';
  }

  /* ——— антиспойлер: предупреждаем, что дальше результат ——— */
  const note = document.createElement('div');
  const showNote = () => {
    note.className = 'spoiler-note';
    note.innerHTML = '<img src="/static/antispoiler.png" alt="">' +
      '<p>Антиспойлер включён, но это страница просмотра — результат станет виден в самом видео.</p>';
    note.style.display = F1.spoilerFree ? 'flex' : 'none';
  };
  showNote();
  document.querySelector('.player-wrap').before(note);
  F1.onSpoiler(() => { note.style.display = F1.spoilerFree ? 'flex' : 'none'; });

  /* ——— другие записи этого этапа ——— */
  const ORDER = {review:-1, race:0, sprint:1, qualifying:2, sprint_qualifying:3, fp3:4, fp2:5, fp1:6};
  const rest = all
    .filter(x => x.race_round === b.race_round && String(x.id) !== String(b.id) && (x.season === (b.season || 2026) || !x.season))
    .sort((a,c) => ((ORDER[a.session_type] ?? 9) - (ORDER[c.session_type] ?? 9)));
  document.getElementById('more').innerHTML = rest.length ? rest.map((x,i) =>
    '<a class="vcard" href="/static/site/video.html?id=' + esc(x.id) + '">' +
      '<div class="thumb">' + img(x.thumbnail_url || (r && r.circuit_image), '', x.title, F1.stockAt(i)) +
        '<span class="play"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M9 7.5v9c0 .95 1.05 1.53 1.86 1.03l7.1-4.5c.75-.47.75-1.59 0-2.06l-7.1-4.5C10.05 5.97 9 6.55 9 7.5z"/></svg></span></div>' +
      '<div class="info"><div class="k">' + esc(LABEL[x.session_type] || '') + '</div>' +
      '<h3>' + esc(x.title || ((r ? cityOf(r) : '') + ' · ' + (LABEL[x.session_type] || ''))) + '</h3></div></a>').join('')
    : '<div class="empty">Других записей этого этапа нет</div>';
})();
</script>
</body>
</html>
